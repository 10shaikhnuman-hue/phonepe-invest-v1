# Netlify config for the PhonePe Invest landing page (static site, no build step).
# Deploy: drag this folder into https://app.netlify.com/drop, or connect the repo
# and set the base directory to "phonepe-invest-v2".

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
